services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vedatax_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vedatax}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vedatax}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vedatax_net

  # ----------------------------------------------------------------------------
  # VedaTax Backend API Service (.NET 8 Web API)
  # Can be built and deployed independently
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vedatax-api:latest
    container_name: vedatax_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-vedatax};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:-dev-only-vedatax-signing-key-change-me-0123456789}
      Jwt__Issuer: VedaTax
      Jwt__Audience: VedaTax.Web
      Cors__Origins__0: http://localhost
      Cors__Origins__1: http://localhost:80
      Cors__Origins__2: http://localhost:3000
      Cors__Origins__3: http://localhost:5173
      Storage__UploadsPath: App_Data/uploads
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@vedatax.test}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-VedaStaff#2026}
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - uploads_data:/app/App_Data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vedatax_net

  # ----------------------------------------------------------------------------
  # VedaTax Website Service (Vite + React + Nginx)
  # Can be built and deployed independently
  # ----------------------------------------------------------------------------
  website:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vedatax-website:latest
    container_name: vedatax_website
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # In unified container mode, Nginx proxies /api to the API service
      BACKEND_URL: http://api:8080
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vedatax_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  vedatax_net:
    driver: bridge
